name: Prepare Native SQLite consumer
description: Checkout an immutable example revision and align it with the current Kronos sources.
inputs:
  example-ref:
    description: Exact commit SHA of the Native SQLite example.
    required: true
  publication-artifact:
    description: Platform publication candidate from this workflow run.
    required: true
runs:
  using: composite
  steps:
    - name: Preserve locked SQLite source bytes on Windows
      shell: bash
      run: git config --global core.autocrlf false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: Kronos-orm/kronos-example-ios
        ref: ${{ inputs.example-ref }}
        path: kronos-example-ios
        persist-credentials: false
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
    - name: Align Kotlin and Kronos versions
      shell: bash
      run: |
        scripts/run .github/scripts/prepare-examples.main.kts native --workspace "$GITHUB_WORKSPACE"

    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: ${{ inputs.publication-artifact }}
        path: build/ci-publications
    - name: Verify the downloaded source candidate
      shell: bash
      run: scripts/run release check-candidate --repository build/ci-publications
