name: Deploy CN Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: temurin

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build merged documentation site
        run: bash kronos-docs/deploy-docs.sh

      - name: Configure SSH
        env:
          CN_DOCS_HOST: ${{ secrets.CN_DOCS_HOST }}
          CN_DOCS_SSH_KEY: ${{ secrets.CN_DOCS_SSH_KEY }}
          CN_DOCS_PORT: ${{ secrets.CN_DOCS_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$CN_DOCS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${CN_DOCS_PORT:-22}" "$CN_DOCS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to cn.kotlinorm.com server
        env:
          CN_DOCS_HOST: ${{ secrets.CN_DOCS_HOST }}
          CN_DOCS_USER: ${{ secrets.CN_DOCS_USER }}
          CN_DOCS_PATH: ${{ secrets.CN_DOCS_PATH }}
          CN_DOCS_PORT: ${{ secrets.CN_DOCS_PORT }}
        run: |
          set -euo pipefail
          rsync -az --delete -e "ssh -p ${CN_DOCS_PORT:-22}" kronos-docs/dist/site/ "$CN_DOCS_USER@$CN_DOCS_HOST:$CN_DOCS_PATH/"
