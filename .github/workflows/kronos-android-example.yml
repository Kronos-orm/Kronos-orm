name: Kronos Android example

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  android-example:
    name: Android API ${{ matrix.api }}
    strategy:
      fail-fast: false
      matrix:
        api: [ 26, 35 ]
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout Kronos
        uses: actions/checkout@v6
        with:
          path: kronos-orm
          persist-credentials: false

      - name: Checkout Android example
        uses: actions/checkout@v6
        with:
          repository: Kronos-orm/kronos-example-android
          ref: f22b19b8a8e2d5117e121f95c102d3d7179c1a5d
          path: kronos-example-android
          persist-credentials: false

      - name: Detect Kronos version
        working-directory: kronos-orm
        run: |
          set -euo pipefail
          version=$(grep -E 'project\.version\s*=\s*"[^"]+"' build-logic/src/main/kotlin/publishing.gradle.kts | head -n1 | sed -E 's/.*project\.version\s*=\s*"([^"]+)".*/\1/')
          echo "KRONOS_EXAMPLE_VERSION=${version}" >> "$GITHUB_ENV"
          kotlin_version=$(sed -nE 's/^kotlin[[:space:]]*=[[:space:]]*"([^"]+)"/\1/p' libs.versions.toml)
          test -n "$version"
          test -n "$kotlin_version"
          echo "KRONOS_EXAMPLE_KOTLIN_VERSION=${kotlin_version}" >> "$GITHUB_ENV"

      - name: Set up JDK 21 for Kronos publication
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish current Android JVM consumer artifacts to Maven local
        working-directory: kronos-orm
        run: >-
          ./gradlew
          :kronos-core:publishKotlinMultiplatformPublicationToMavenLocal
          :kronos-core:publishJvmPublicationToMavenLocal
          :kronos-syntax:publishKotlinMultiplatformPublicationToMavenLocal
          :kronos-syntax:publishJvmPublicationToMavenLocal
          :kronos-logging:publishKotlinMultiplatformPublicationToMavenLocal
          :kronos-logging:publishJvmPublicationToMavenLocal
          :kronos-compiler-plugin:publishToMavenLocal
          --no-daemon --console=plain

      - name: Publish current Kronos Gradle plugin to Maven local
        working-directory: kronos-orm/kronos-gradle-plugin
        run: ./gradlew publishToMavenLocal --no-daemon --console=plain -x test

      - name: Point Android example to current Kronos version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["KRONOS_EXAMPLE_VERSION"]
          kotlin_version = os.environ["KRONOS_EXAMPLE_KOTLIN_VERSION"]
          replacements = {
              "kronos-example-android/build.gradle.kts": [
                  (r'id\("org\.jetbrains\.kotlin\.android"\) version "[^"]+"', f'id("org.jetbrains.kotlin.android") version "{kotlin_version}"'),
                  (r'id\("com\.kotlinorm\.kronos-gradle-plugin"\) version "[^"]+"', f'id("com.kotlinorm.kronos-gradle-plugin") version "{version}"'),
              ],
              "kronos-example-android/app/build.gradle.kts": [
                  (r'implementation\("com\.kotlinorm:kronos-core:[^"]+"\)', f'implementation("com.kotlinorm:kronos-core:{version}")'),
                  (r'implementation\("com\.kotlinorm:kronos-logging:[^"]+"\)', f'implementation("com.kotlinorm:kronos-logging:{version}")'),
              ],
          }

          for file_name, patterns in replacements.items():
              path = Path(file_name)
              text = path.read_text()
              for pattern, replacement in patterns:
                  text, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
                  if count != 1:
                      raise SystemExit(f"missing expected pattern in {file_name}: {pattern}")
              path.write_text(text)
          PY

      - name: Set up JDK 17 for Android
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build and lint Android example
        working-directory: kronos-example-android
        run: |
          chmod +x ./gradlew
          ./gradlew -PkronosUseMavenLocal=true :app:assembleDebug :app:lintDebug --no-daemon --console=plain

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented SQLite compatibility tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: kronos-example-android
          script: |
            adb devices -l
            adb shell getprop ro.build.version.sdk
            ./gradlew -PkronosUseMavenLocal=true :app:connectedDebugAndroidTest --no-daemon --console=plain --stacktrace

      - name: Require executed instrumentation tests
        run: |
          report_dir=kronos-example-android/app/build/outputs/androidTest-results/connected/debug
          python3 kronos-orm/.github/scripts/verify-kmp-test-results.py "$report_dir"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kmp-android-api-${{ matrix.api }}-reports
          path: |
            kronos-example-android/app/build/reports/**
            kronos-example-android/app/build/outputs/androidTest-results/**
          if-no-files-found: error
