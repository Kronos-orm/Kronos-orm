name: Kronos example projects
on:
  workflow_call:
    inputs:
      publication-artifact:
        type: string
        required: true
env:
  MYSQL_DRIVER: com.mysql.cj.jdbc.Driver
  MYSQL_JDBC_URL: jdbc:mysql://127.0.0.1:3306/kronos_testing
  MYSQL_USERNAME: kronos
  MYSQL_PASSWORD: kronos
  KRONOS_CONSUMER_EVIDENCE_DIR: ${{ github.workspace }}/consumer-resolution
jobs:
  examples:
    name: Run example projects
    runs-on: ubuntu-22.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: kronos_testing
          MYSQL_USER: kronos
          MYSQL_PASSWORD: kronos
          MYSQL_ROOT_PASSWORD: kronos
        ports:
        - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -ukronos -pkronos" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
    - name: Checkout Kronos
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        path: kronos-orm
        persist-credentials: false
    - name: Checkout Ktor example
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: Kronos-orm/kronos-example-ktor
        path: kronos-example-ktor
        persist-credentials: false
    - name: Checkout Spring Boot example
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: Kronos-orm/kronos-example-spring-boot
        path: kronos-example-spring-boot
        persist-credentials: false
    - name: Checkout Solon example
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: Kronos-orm/kronos-example-solon
        path: kronos-example-solon
        persist-credentials: false
    - name: Checkout Vert.x example
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: Kronos-orm/kronos-example-vertx
        path: kronos-example-vertx
        persist-credentials: false
    - name: Set up JDK 21
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: 21
        distribution: adopt
    - uses: ./kronos-orm/.github/actions/setup-toolchain
      with:
        lane: server-examples
    - name: Detect Kronos version
      working-directory: kronos-orm
      run: |
        set -euo pipefail
        version=$(scripts/run version show)
        kotlin_version=$(scripts/run version json | jq -er .kotlin)
        echo "KRONOS_EXAMPLE_VERSION=${version}" >> "$GITHUB_ENV"
        echo "KRONOS_EXAMPLE_KOTLIN_VERSION=${kotlin_version}" >> "$GITHUB_ENV"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.publication-artifact }}
        path: kronos-orm/build/example-publications
    - name: Verify shared JVM publication candidate
      working-directory: kronos-orm
      run: scripts/run release check-candidate --repository build/example-publications
    - name: Select the Toolchain-built Maven repository
      run: echo "JAVA_TOOL_OPTIONS=-Dmaven.repo.local=$GITHUB_WORKSPACE/kronos-orm/build/example-publications" >> "$GITHUB_ENV"
    - name: Point examples to current Kronos version
      run: |
        set -euo pipefail
        kronos-orm/scripts/run .github/scripts/prepare-examples.main.kts jvm --workspace "$GITHUB_WORKSPACE"
    - name: Run Ktor example smoke tests
      working-directory: kronos-example-ktor
      run: '"$GITHUB_WORKSPACE/kronos-orm/scripts/run" .github/scripts/run-kmp-gradle-gate.main.kts bash ./gradlew test --no-daemon --console=plain'
    - name: Run Spring Boot Gradle example smoke tests
      working-directory: kronos-example-spring-boot/gradle-project
      run: '"$GITHUB_WORKSPACE/kronos-orm/scripts/run" .github/scripts/run-kmp-gradle-gate.main.kts bash ./gradlew test --no-daemon --console=plain'
    - name: Run Spring Boot Maven example smoke tests
      working-directory: kronos-example-spring-boot/maven-project
      run: |
        mvn -B test
        "$GITHUB_WORKSPACE/kronos-orm/scripts/run" .github/scripts/record-maven-consumer.main.kts
    - name: Run Solon example smoke tests
      working-directory: kronos-example-solon
      run: |
        mvn -B test
        "$GITHUB_WORKSPACE/kronos-orm/scripts/run" .github/scripts/record-maven-consumer.main.kts
    - name: Run Vert.x example smoke tests
      working-directory: kronos-example-vertx
      run: |
        chmod +x ./gradlew
        "$GITHUB_WORKSPACE/kronos-orm/scripts/run" .github/scripts/run-kmp-gradle-gate.main.kts bash ./gradlew test --no-daemon --console=plain
    - name: Record consumed candidate bytes
      run: scripts/run release receipt --repository build/example-publications --group server --family jvm --output "$GITHUB_WORKSPACE/consumer-receipt.json"
      working-directory: kronos-orm
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: receipt-server
        path: consumer-receipt.json
        if-no-files-found: error
        overwrite: true
