name: Kronos IDE support
on:
  workflow_call: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  editor:
    name: KEFS editor contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: '25'
    - uses: ./.github/actions/setup-toolchain
      with:
        lane: ide
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ci-jvm
        path: build/ci-input
    - name: Verify editor compiler candidate
      run: scripts/run release check-candidate --repository build/ci-input
    - name: Prepare editor runner
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libxi6 libxrender1 libxtst6 fontconfig
    - name: Run actual IDEA and KEFS against the publication candidate
      run: |
        version=$(scripts/run version show)
        base="$GITHUB_WORKSPACE/build/ci-input/com/kotlinorm"
        xvfb-run -a scripts/run ide test --skip-build --cli-jar "$base/kronos-compiler-plugin/$version/kronos-compiler-plugin-$version.jar" --core-jar "$base/kronos-core-jvm/$version/kronos-core-jvm-$version.jar" --syntax-jar "$base/kronos-syntax-jvm/$version/kronos-syntax-jvm-$version.jar"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: kronos-ide-support-reports
        path: |
          build/ide/sdk.json
          build/ide/verification.json
          build/ide/toolchain/reports/ide/jvm/**
          build/ide/compatibility-repository/compatibility-candidate.json
          build/ide/shared-kotlin-plugins.xml
          build/ide/sandbox/log/**
        if-no-files-found: warn
        overwrite: true
    - name: Record consumed candidate bytes
      run: scripts/run release receipt --repository build/ci-input --group ide --family jvm --output "$GITHUB_WORKSPACE/consumer-receipt.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: receipt-ide
        path: consumer-receipt.json
        if-no-files-found: error
        overwrite: true
