name: Publish Kronos

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kronos-central-publication
  cancel-in-progress: false

jobs:
  kmp-verification:
    uses: ./.github/workflows/kronos-kmp-testing.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write

  publish:
    needs: kmp-verification
    name: Publish verified Toolchain artifacts
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: temurin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kmp-publication-repository
          path: build/release/repository
      - name: Verify the exact tested publication repository
        run: scripts/run release verify --repository build/release/repository
      - name: Detect publication version
        id: detect
        run: |
          version=$(scripts/run version show)
          echo "current=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "mode=snapshot" >> "$GITHUB_OUTPUT"
          else
            echo "mode=release" >> "$GITHUB_OUTPUT"
          fi
      - name: Sign the completed Maven bundle
        if: steps.detect.outputs.mode == 'release'
        env:
          KOTLIN_TOOLCHAIN_SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if ! command -v gpg; then brew install gnupg; fi
          scripts/run release bundle --repository build/release/repository --output dist/release/central-bundle.zip --sign
      - name: Publish the signed release to Maven Central
        if: steps.detect.outputs.mode == 'release'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: scripts/run release publish --output dist/release/central-bundle.zip
      - name: Publish timestamped snapshots
        if: steps.detect.outputs.mode == 'snapshot'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: scripts/run release publish-snapshot --repository build/release/repository
      - name: Collect release binaries and checksums
        if: steps.detect.outputs.mode == 'release'
        run: |
          scripts/run ci collect-release
      - name: Create the GitHub release
        if: steps.detect.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.detect.outputs.current }}
        run: |
          tag="v$RELEASE_VERSION"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" dist/release/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$tag" dist/release/* --repo "${{ github.repository }}" --title "Kronos $RELEASE_VERSION" --generate-notes --latest=true
          fi
      - name: Configure version commit author
        if: steps.detect.outputs.mode == 'release'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Release 🔼 - open next SNAPSHOT PR
        if: steps.detect.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_VERSION="${{ steps.detect.outputs.current }}"
          if [ -z "$RELEASE_VERSION" ]; then
            RELEASE_VERSION="${{ steps.detect.outputs.current }}"
          fi

          if [[ ! "$RELEASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Cannot calculate next SNAPSHOT from release version: $RELEASE_VERSION" >&2
            exit 1
          fi

          NEXT_SNAPSHOT="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-SNAPSHOT"
          BRANCH_NAME="codex/next-snapshot-${NEXT_SNAPSHOT%-SNAPSHOT}"

          EXISTING_PR_URL=$(gh pr list \
            --repo "${{ github.repository }}" \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH_NAME" \
            --state open \
            --json url \
            --jq '.[0].url // ""')

          if [ -n "$EXISTING_PR_URL" ]; then
            echo "Next SNAPSHOT PR already exists: $EXISTING_PR_URL"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "Remote branch $BRANCH_NAME already exists. Opening a PR for it."
            gh pr create \
              --repo "${{ github.repository }}" \
              --base "${{ github.ref_name }}" \
              --head "$BRANCH_NAME" \
              --title "chore(version): start $NEXT_SNAPSHOT" \
              --body "Start the next development cycle after publishing $RELEASE_VERSION by bumping release configuration to $NEXT_SNAPSHOT."
            exit 0
          fi

          BUMPED_SNAPSHOT=$( scripts/run version next-snapshot | tail -n1 | cut -d= -f2 )
          if [ "$BUMPED_SNAPSHOT" != "$NEXT_SNAPSHOT" ]; then
            echo "Expected next SNAPSHOT $NEXT_SNAPSHOT, but version script produced $BUMPED_SNAPSHOT" >&2
            exit 1
          fi

          git switch -c "$BRANCH_NAME"
          git add -A
          if git diff --cached --quiet; then
            echo "No version changes to commit; skipping next SNAPSHOT PR."
            exit 0
          fi
          git commit -m "chore(version): start $NEXT_SNAPSHOT"
          git push --set-upstream origin "$BRANCH_NAME"
          gh pr create \
            --repo "${{ github.repository }}" \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH_NAME" \
            --title "chore(version): start $NEXT_SNAPSHOT" \
            --body "Start the next development cycle after publishing $RELEASE_VERSION by bumping release configuration to $NEXT_SNAPSHOT."
