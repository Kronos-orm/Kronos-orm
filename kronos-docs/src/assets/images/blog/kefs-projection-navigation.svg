<title id="title">A query alias becomes a navigable Kotlin property</title><desc id="desc">Kronos generates a nullable Int property named rn from a rowNumber alias. KEFS loads the compiler extension into Kotlin editor analysis. Navigation opens the generated Kotlin property declaration.</desc>
<text class="muted" x="46" y="54">QUERY DECLARATION</text><text class="muted" x="375" y="54">GENERATED ROW</text><text class="muted" x="705" y="54">KOTLIN EDITOR</text>
<rect class="box" x="30" y="82" width="290" height="212" rx="12"/><text class="code" x="52" y="132">f.rowNumber()</text><text class="code" x="52" y="171">  .alias("rn")</text><rect x="164" y="150" width="39" height="29" rx="4" fill="#7860a4" fill-opacity=".35"/>
<text class="muted" x="52" y="260">Projection field declaration</text>
<path class="line" d="M321 188h35" marker-end="url(#arrow)"/>
<rect class="box" x="365" y="82" width="270" height="212" rx="12"/><text class="label" x="388" y="134">Result row</text><text class="code" x="388" y="185">rn: Int?</text><text class="muted" x="388" y="260">Generated by Kronos</text>
<path class="line" d="M636 188h35" marker-end="url(#arrow)"/>
<rect class="box" x="680" y="82" width="290" height="212" rx="12"/><text class="code" x="702" y="134">it.rn</text><text class="muted" x="702" y="178">Completion · type hover</text><text class="muted" x="702" y="211">Go to generated property</text><text class="muted" x="702" y="260">K2 analysis through KEFS</text>
<path d="M825 294v54H500v-53" class="line" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text class="muted" x="500" y="386" text-anchor="middle">Navigation opens the generated Kotlin property declaration</text>
</svg>
