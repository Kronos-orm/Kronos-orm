<title id="title">Shared Kotlin code and platform-owned connections</title><desc id="desc">commonMain shares KPojo models and queries. JVM uses JDBC, Android uses SQLiteDatabase, and Native uses a SQLite adapter. Each platform owns its connection.</desc>
