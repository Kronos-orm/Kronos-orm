product:
  type: kmp/lib
  platforms:
    - jvm
    - iosArm64
    - iosX64
    - iosSimulatorArm64
    - linuxArm64
    - linuxX64
    - macosArm64
    - macosX64
    - mingwX64
    - tvosArm64
    - tvosSimulatorArm64
    - tvosX64
    - watchosArm64
    - watchosDeviceArm64
    - watchosSimulatorArm64

apply:
  - //templates/common.module-template.yaml

description: Multiplatform logging adapters for Kronos ORM.

dependencies:
  - //kronos-core: exported

test-dependencies@jvm:
  - $libs.kotlin.reflect

plugins:
  kronos-native:
    enabled: true
    generateMetadata: false
    compilerExecutable: ../build/tasks/_kronos-syntax_buildWatchosX64@kronos-native/compiler/bin/konanc
    sourceDirectories:
      common: [src]
      native: [src@native]
    watchLibraries:
      - ../build/tasks/_kronos-core_buildWatchosX64@kronos-native/kronos-core-watchosx64.klib
      - ../build/tasks/_kronos-syntax_buildWatchosX64@kronos-native/kronos-syntax-watchosx64.klib
    watchExternalDependencies: [ktx-datetime]
    stageRepository: ../build/tasks/_kronos-core_finalizeNativePublication@kronos-native/repository
    freeCompilerArgs: [-Xcontext-sensitive-resolution, -Xcollection-literals, -Xexpect-actual-classes, -opt, -ea]
